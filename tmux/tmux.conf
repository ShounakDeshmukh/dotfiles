# ---------- general ----------
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"
set -sg escape-time 0
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
# Otherwise zsh's transient prompt redraw on the top row copies the full prompt into history
set -g scroll-on-clear off

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ---------- window names ----------
# Shell -> directory name, anything else -> running command (nvim, htop, ...)
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#S / #W"

# ---------- keys ----------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# New windows and panes open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix H resize-pane -L 5
bind -r -T prefix J resize-pane -D 5
bind -r -T prefix K resize-pane -U 5
bind -r -T prefix L resize-pane -R 5

bind -n M-H previous-window
bind -n M-L next-window

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------- catppuccin ----------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_status_background "none"
set -g @catppuccin_pane_border_status "off"
set -g @catppuccin_application_icon " "

set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_application}"

# ---------- plugins ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'

run '~/.config/tmux/plugins/tpm/tpm'

# Needs catppuccin's colors, so it goes after the plugins load
set -g popup-border-lines rounded
set -gF popup-border-style "fg=#{@thm_lavender}"
