source = $HOME/.config/hypr/mocha.conf
$scripts = $HOME/dotfiles/hypr/scripts

# BACKGROUND - Blurred screen
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    grace = 0
    disable_loading_bar = false
}

# NAME
label {
    monitor =
    text = $USER
    color = $text
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 20
    position = 0, 80
    halign = center
    valign = center
}

# Time (Enhanced with mauve accent)
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $mauve
    font_size = 60
    position = 0, -20
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $text
    font_size = 19
    font_family = SF Pro Display Bold
    position = 0, -90
    halign = center
    valign = center
}

# MAIN-BOX (Catppuccin Surface0 with vibrant mauve accent)
shape {
    monitor =
    size = 500, 500
    color = $surface0
    rounding = 30
    border_size = 2
    border_color = $mauve
    rotate = 0
    xray = false 
    position = 0, -70
    halign = center
    valign = center
}

# USER-BOX (Catppuccin Surface1 with lavender accent)
shape {
    monitor =
    size = 320, 55
    color = $surface1
    rounding = 15
    border_size = 1
    border_color = $lavender
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 0, -190
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = $text
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    position = 0, -190
    halign = center
    valign = center
}

# PASS-BOX (same shape as USER-BOX)
shape {
    monitor =
    size = 320, 55
    color = $surface1
    rounding = 15
    border_size = 1
    border_color = $lavender
    rotate = 0
    xray = false
    position = 0, -268
    halign = center
    valign = center
}

# INPUT FIELD (Enhanced Catppuccin colors with blue accent)
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $blue
    inner_color = $surface1
    font_color = $text
    check_color = $green
    fail_color = $red
    fade_on_empty = false
    placeholder_text = <i><span foreground="##$textAlpha">   Enter Pass</span></i>
    hide_input = false
    position = 0, -268
    halign = center
    valign = center
}

# BATTERY CONTAINER (Stylish background)
shape {
    monitor =
    size = 120, 40
    color = $surface0
    rounding = 20
    border_size = 1
    border_color = $green
    halign = right
    valign = top
    position = -20, -20
}

# BATTERY INFO (Fixed with multiple fallback methods)
label {
    monitor =
    text = cmd[update:5000] echo "$($scripts/hyprlock-battery)"
    text_align = center
    color = $green
    font_size = 14
    # font_family = SF Pro Display
    halign = right
    valign = top
    position = -50,-25
}
